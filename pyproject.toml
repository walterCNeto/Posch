[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credrisk"
version = "0.1.0"
description = "Curso de risco de crédito em Python — modelos, bases sintéticas e notebooks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Walter C. Neto" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "nbformat>=5.10",
    "nbclient>=0.10",
]
book = [
    "jupyter-book>=1.0,<2",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["credrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Sem isto, o padrão "test*" faria o pytest coletar funções em português
# chamadas teste_binomial, teste_berkowitz etc. como se fossem casos de teste.
python_functions = ["test_*"]
markers = ["slow: teste demorado (amostra grande)"]

[tool.ruff]
line-length = 95
# Texto em Markdown dentro dos scripts de notebook e das fórmulas LaTeX não se
# quebra sem perder legibilidade; a regra de comprimento vale para código.
extend-exclude = []
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Fórmulas LaTeX e prosa em Markdown nos geradores de notebook.
"scripts/build_cap*.py" = ["E501"]
# Fórmulas LaTeX em docstring perdem legibilidade se quebradas na marra.
"credrisk/correlation/vasicek.py" = ["E501"]
"credrisk/portfolio/montecarlo.py" = ["E501"]
